<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- 插件管理页的图形：DSH 读成 base64 data URL 后用 <img> 渲染，
     故页面 CSS 与 currentColor 都够不到——颜色必须写死在本文件里。
     画布 36×36 与内置那套图形（PluginArtworkDefault 等）一致。

     字形是「文」的真实轮廓，不是手画的等粗线条：取 Noto Sans SC 的 wght=900
     （SIL OFL 1.1，允许嵌入与再分发；Windows 自带的微软雅黑/黑体/等线是商业
     授权字体，不可嵌入分发）。真实轮廓自带横细竖粗与撇捺出锋，等粗线条在
     36px 下会读成火柴棍。21px 字号让墨迹占画布 56%，与官方 voice-input 的
     声波图标同占比；再大就显得挤，再小则撑不住 36px 的格子。 -->
<defs>
<linearGradient id="fsenc-g" x1="18" y1="6" x2="18" y2="30" gradientUnits="userSpaceOnUse">
<stop stop-color="#7AC2FF"/>
<stop offset="1" stop-color="#4A65E8"/>
</linearGradient>
</defs>
<g transform="translate(7.4475 26.1270) scale(0.02100000 -0.02100000)" fill="url(#fsenc-g)">
